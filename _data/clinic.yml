emergency:
  badge: "24/7 Eigen Wachtdienst"
  title: "Wat bij een spoedgeval?"
  text: "Buiten de openingsuren voorzien wij grotendeels onze eigen wachtdienst voor dringende spoedgevallen. U kunt 24/7 bellen naar 09/352.53.54, waarbij u ofwel rechtstreeks met de dierenarts van dienst wordt verbonden, ofwel duidelijk geïnstrueerd wordt welke dierenarts van wacht paraat staat."
  symptoms:
    - "Aanhoudende diarree of braken (> 24 uur)"
    - "Plotseling verlies van eetlust of lusteloosheid (> 24 uur)"
    - "Moeite, pijn of persen bij het plassen of ontlasten"
    - "Acuut trauma (aanrijding, val, diepe snijwonde)"
    - "Hardnekkige benauwdheid, piepende of abnormale ademhaling"
    - "Plotselinge verlamming of acute kreupelheid"
    - "Vermoeden van vergiftiging (chocolade, lelies, rattengif, etc.)"


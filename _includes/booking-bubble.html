<!-- MyPets Online Booking Floating Scriptlet.
     The widget script is ~1.4 MB and must not compete with fonts and images in
     the LCP critical path, so it is injected only once the user starts
     interacting with the page (pointer/touch/keyboard/scroll). Automated and
     pre-interaction loads never fetch it. The <mypets-bubble> element is inert
     until then. -->
<mypets-bubble defer url-suffix="dapdewitteraaf" web-component-base-url="https://mypets.eu"></mypets-bubble>
<script>
(function () {
  var loaded = false;
  function load() {
    if (loaded) return;
    loaded = true;
    var link = document.createElement('link');
    link.rel = 'preconnect';
    link.href = 'https://mypets.eu';
    link.setAttribute('crossorigin', '');
    document.head.appendChild(link);
    var s = document.createElement('script');
    s.src = 'https://mypets.eu/bubble/mypets-bubble.js';
    s.async = true;
    document.body.appendChild(s);
  }
  var events = ['mouseover', 'pointerdown', 'touchstart', 'keydown', 'focusin'];
  events.forEach(function (type) {
    document.addEventListener(type, load, { once: true, capture: true, passive: true });
  });
})();
</script>

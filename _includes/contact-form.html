<form id="contact-form" action="https://forms.formward.eu/f/72ef4839-c7ad-418a-adb3-a68e701d3af8" method="POST" class="contact-form">
  <!-- Anti-Spam Honeypot (Invisible to real humans, traps bots) -->
  <div class="form-honeypot" aria-hidden="true">
    <label for="contact-gotcha">Laat dit veld leeg:</label>
    <input type="text" id="contact-gotcha" name="_gotcha" tabindex="-1" autocomplete="off">
  </div>

  <!-- Reply-To: lets the practice hit Reply in their mail client and answer the visitor directly -->
  <input type="hidden" name="_replyto" id="contact-replyto" value="">

  <div class="form-group">
    <label for="contact-name" class="form-label">Uw Naam *</label>
    <input type="text" id="contact-name" name="name" class="form-control" required placeholder="bijv. Jan Jansen" autocomplete="name">
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
    <div class="form-group">
      <label for="contact-email" class="form-label">E-mailadres *</label>
      <input type="email" id="contact-email" name="email" class="form-control" required placeholder="naam@voorbeeld.be" autocomplete="email">
    </div>

    <div class="form-group">
      <label for="contact-phone" class="form-label">Telefoonnummer *</label>
      <input type="tel" id="contact-phone" name="phone" class="form-control" required placeholder="0470 12 34 56" autocomplete="tel" inputmode="tel">
    </div>
  </div>

  <div class="form-group">
    <label for="contact-subject" class="form-label">Onderwerp *</label>
    <select id="contact-subject" name="subject" class="form-control" required>
      <option value="" disabled selected>— Kies een onderwerp —</option>
      <option value="Voeding of medicatie bestellen">Voeding of medicatie bestellen</option>
      <option value="Informatie over diensten of behandelingen">Informatie over diensten of behandelingen</option>
      <option value="Vraag over mijn huisdier">Vraag over mijn huisdier</option>
      <option value="Stageplaats of sollicitatie">Stageplaats of sollicitatie</option>
      <option value="Andere vraag">Andere vraag</option>
    </select>
  </div>

  <div class="form-group">
    <label for="contact-message" class="form-label">Uw Bericht *</label>
    <textarea id="contact-message" name="message" class="form-control" rows="5" required placeholder="Beschrijf uw vraag of bestelling (bij voeding: merk, type en gewicht)..."></textarea>
  </div>

  <div class="form-group" style="margin-top: 1rem;">
    <label style="display: flex; align-items: flex-start; gap: 0.65rem; font-size: 0.85rem; color: var(--color-text-muted); cursor: pointer;">
      <input type="checkbox" name="_consent" required style="margin-top: 0.2rem;">
      <span>Ik ga ermee akkoord dat mijn gegevens worden verwerkt om contact met mij op te nemen conform het <a href="{{ '/privacy-policy/' | relative_url }}" target="_blank" style="text-decoration: underline; color: var(--color-primary);">privacybeleid</a>. *</span>
    </label>
  </div>

  <div style="margin-top: 1.5rem;">
    <button type="submit" class="btn btn-primary" style="width: 100%;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      Verstuur bericht
    </button>
  </div>

  <!-- Realtime feedback alert container -->
  <div id="form-status" class="form-status" role="alert" aria-live="polite"></div>
</form>

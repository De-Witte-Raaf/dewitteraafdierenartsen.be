<div class="header-sticky">
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a href="{{ '/' | relative_url }}" class="brand-link" aria-label="De Witte Raaf Home">
        <img src="{{ '/assets/branding/logos/dewitteraaf_logo_tagline.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="De Witte Raaf Dierenartsen – Uw dier, onze zorg" class="brand-logo brand-logo-light" width="110" height="72">
        <img src="{{ '/assets/branding/logos/dewitteraaf_woordmerk_horizontaal_wit.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="De Witte Raaf Dierenartsen" class="brand-logo brand-logo-dark" width="130" height="28">
      </a>

      <div class="header-award-badge">
        <picture>
          <source type="image/webp" srcset="{{ '/assets/images/generated/cat-friendly-clinic-200.webp' | relative_url }} 200w, {{ '/assets/images/generated/cat-friendly-clinic-300.webp' | relative_url }} 300w, {{ '/assets/images/generated/cat-friendly-clinic-400.webp' | relative_url }} 400w" sizes="85px">
          <img src="{{ '/assets/images/generated/cat-friendly-clinic-200.png' | relative_url }}" srcset="{{ '/assets/images/generated/cat-friendly-clinic-200.png' | relative_url }} 200w, {{ '/assets/images/generated/cat-friendly-clinic-300.png' | relative_url }} 300w, {{ '/assets/images/generated/cat-friendly-clinic-400.png' | relative_url }} 400w" sizes="85px" alt="Cat Friendly Clinic Gold Certification" width="85" height="60">
        </picture>
        <span class="header-award-text">
          Gold Level Certified Clinic
          <span>International Society of Feline Medicine</span>
        </span>
      </div>

      <div class="header-right">
        <nav class="site-nav" id="site-nav" aria-label="Hoofdnavigatie">
          <ul class="nav-list">
            {% for item in site.data.navigation.main %}
            <li>
              <a href="{{ item.url | relative_url }}" class="nav-link {% if page.url == item.url %}active{% endif %}">
                {{ item.title }}
              </a>
            </li>
            {% endfor %}
          </ul>
        </nav>

        <a href="{{ site.data.navigation.cta.url }}" target="_blank" rel="noopener" class="btn btn-primary btn-sm header-cta" aria-label="{{ site.data.navigation.cta.title }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          <span class="header-cta-text">{{ site.data.navigation.cta.title }}</span>
        </a>

        <button class="theme-toggle" type="button" aria-label="Schakel donkere modus" title="Schakel donkere modus">
          <svg class="theme-toggle-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="theme-toggle-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <button class="mobile-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu openen">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>
</div>

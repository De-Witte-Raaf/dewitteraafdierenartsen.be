<div class="header-sticky">
  <header class="site-header" id="site-header">
    <div class="container header-main">
      <a href="{{ '/' | relative_url }}" class="brand-link" aria-label="De Witte Raaf Home">
        <img src="{{ '/assets/branding/logos/dewitteraaf_logo_tagline.svg' | relative_url }}?v={{ site.time | date: '%s' }}" alt="De Witte Raaf Dierenartsen – Uw dier, onze zorg" class="brand-logo" width="110" height="72">
      </a>

      <nav class="site-nav" id="site-nav" aria-label="Hoofdnavigatie">
        <div class="header-award-badge">
          <picture>
            <source type="image/webp" srcset="{{ '/assets/images/generated/cat-friendly-clinic-200.webp' | relative_url }} 200w, {{ '/assets/images/generated/cat-friendly-clinic-400.webp' | relative_url }} 400w" sizes="54px">
            <img src="{{ '/assets/images/generated/cat-friendly-clinic-200.png' | relative_url }}" srcset="{{ '/assets/images/generated/cat-friendly-clinic-200.png' | relative_url }} 200w, {{ '/assets/images/generated/cat-friendly-clinic-400.png' | relative_url }} 400w" sizes="54px" alt="Cat Friendly Clinic Gold Certification" width="54" height="38">
          </picture>
          <span class="header-award-text">
            Gold Level Certified Clinic
            <span>International Society of Feline Medicine</span>
          </span>
        </div>

        <ul class="nav-list">
          {% for item in site.data.navigation.main %}
          <li>
            <a href="{{ item.url | relative_url }}" class="nav-link {% if page.url == item.url %}active{% endif %}">
              {{ item.title }}
            </a>
          </li>
          {% endfor %}
        </ul>

        <a href="tel:{{ site.data.clinic.contact.emergency_phone_clean }}" class="header-emergency" aria-label="Spoedgeval? Bel onze wachtdienst 24/7 op {{ site.data.clinic.contact.emergency_phone }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <span class="header-emergency-text">Spoedgeval? <strong>{{ site.data.clinic.contact.emergency_phone }}</strong></span>
        </a>

        <a href="{{ site.data.navigation.cta.url }}" target="_blank" rel="noopener" class="btn btn-primary btn-sm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          {{ site.data.navigation.cta.title }}
        </a>
      </nav>

      <div class="header-actions">
        <a href="tel:{{ site.data.clinic.contact.emergency_phone_clean }}" class="header-phone-link" aria-label="Spoedgeval? Bel onze wachtdienst 24/7 op {{ site.data.clinic.contact.emergency_phone }}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <span>{{ site.data.clinic.contact.emergency_phone }}</span>
        </a>
        <button class="mobile-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu openen">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>
</div>

<!-- Top Emergency & Info Banner -->
<div class="emergency-topbar">
  <div class="container emergency-topbar-content">
    <span>🚨 <strong>Dringend spoedgeval?</strong> Bel onze wachtdienst 24/7 op <a href="tel:{{ site.data.clinic.contact.emergency_phone_clean }}">{{ site.data.clinic.contact.emergency_phone }}</a></span>
    <span>Afhalen voeding & medicatie doorlopend mogelijk tijdens openingsuren</span>
  </div>
</div>

<!-- Main Sticky Header -->
<header class="site-header" id="site-header">
  <div class="container header-main">
    <a href="/" class="brand-link" aria-label="De Witte Raaf Home">
      <img src="/assets/branding/logos/dewitteraaf_logo_embleem.svg" alt="" class="brand-emblem" width="44" height="44">
      <img src="/assets/branding/logos/dewitteraaf_woordmerk_horizontaal.svg" alt="De Witte Raaf Dierenartsen" class="brand-wordmark" width="220" height="38">
    </a>

    <nav class="site-nav" id="site-nav" aria-label="Hoofdnavigatie">
      <ul class="nav-list">
        {% for item in site.data.navigation.main %}
        <li>
          <a href="{{ item.url }}" class="nav-link {% if page.url == item.url %}active{% endif %}">
            {{ item.title }}
          </a>
        </li>
        {% endfor %}
      </ul>

      <a href="{{ site.data.navigation.cta.url }}" target="_blank" rel="noopener" class="btn btn-primary btn-sm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        {{ site.data.navigation.cta.title }}
      </a>
    </nav>

    <button class="mobile-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu openen">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </div>
</header>

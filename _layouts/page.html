---
layout: default
---
<section class="page-header" style="background: linear-gradient(135deg, var(--color-surface-soft) 0%, var(--color-white) 100%); padding: clamp(2.5rem, 5vw, 4rem) 0; border-bottom: 1px solid var(--color-border-subtle);">
  <div class="container text-center">
    {% if page.badge %}
    <span class="badge badge-green" style="margin-bottom: 0.75rem;">{{ page.badge }}</span>
    {% endif %}
    <h1 style="margin-bottom: 0.75rem;">{{ page.title }}</h1>
    {% if page.subtitle %}
    <p style="font-size: 1.15rem; color: var(--color-text-muted); max-width: 680px; margin: 0 auto;">{{ page.subtitle }}</p>
    {% endif %}
  </div>
</section>

<div class="container section-padding">
  {{ content }}
</div>
